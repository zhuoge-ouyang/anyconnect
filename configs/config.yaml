# AnyConnect Split Tunnel Configuration

# Original gateway (auto-detected, saved here for recovery)
original_gateway: ""

# Original local interface index (auto-detected, saved here for stable routes)
original_interface_index: 0

# Original IPv6 gateway/interface (auto-detected; IPv6 routes are skipped if empty)
original_ipv6_gateway: ""
original_ipv6_interface_index: 0

# Enable/disable split tunneling
split_tunnel_enabled: true

# Traffic backend: auto, openconnect_tun, cisco_static
traffic_backend: "auto"
openconnect_path: ""
sing_box_path: ""

# IPv6 CN routes are disabled by default because thousands of IPv6 host routes
# make Windows/AnyConnect noticeably less stable on some machines.
ipv6_split_enabled: false

# Start with Windows
auto_start: false

# Connect automatically with credentials stored in Windows Credential Manager
auto_connect: false

# Preferred VPN site for foreign/global traffic. Domestic traffic bypasses VPN through split routes.
preferred_site: "23.澳大利亚"

# Saved username for auto-connect. Password is stored in Windows Credential Manager.
saved_username: ""

# Codex stable mode tests these sites in order, then picks the fastest healthy one.
codex_auto_select: true
codex_mode_active: false
codex_preferred_site: "23.澳大利亚"
codex_probe_attempts: 2
codex_candidate_sites:
  - "23.澳大利亚"
  - "22.日本"
  - "21.韩国"
  - "20.泰国"
  - "25.英国"
  - "24.美国"

