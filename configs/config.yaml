# 国外 VPN 优先模式下可手动追加的国内 IP/CIDR 白名单。
domestic_ip_exceptions: []

# 分流模式：
#   domestic_direct - 默认全部直连，仅国外白名单走 VPN（默认）
#   foreign_direct  - 默认全部走 VPN，仅国内白名单直连
split_mode: "domestic_direct"

# 单次静态路由计划最大条数。超过该值会拒绝写入，避免出现 2 万+ 路由卡死。
route_entry_limit: 2000

# 国内直连模式下走 VPN 的国外域名白名单。
