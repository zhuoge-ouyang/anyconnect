  - "tencent.com"       # 腾讯主域名（覆盖 meeting.tencent.com 等）
  - "wemeet.app"        # 腾讯会议独立域名
  # 哔哩哔哩
  - "bilibili.com"      # B站主域名
  - "bilivideo.com"     # B站视频CDN
  - "hdslb.com"         # B站静态资源CDN
  - "b23.tv"            # B站短链域名
  # 电商
  - "jd.com"            # 京东主域名
  - "360buyimg.com"     # 京东图片/静态资源
  - "taobao.com"        # 淘宝主域名
  - "tmall.com"         # 天猫主域名
  - "mmstat.com"        # 淘宝/天猫统计与埋点
  - "tbcdn.cn"          # 淘宝 CDN
  # 房产
